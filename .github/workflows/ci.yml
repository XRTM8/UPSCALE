name: Build and verify

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      CARGO_BUILD_JOBS: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Prepare Rust
        shell: pwsh
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy --target wasm32-unknown-unknown
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-rust-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: ${{ runner.os }}-rust-
      - name: Prepare tooling and assets
        shell: pwsh
        run: |
          npm install --global pnpm@11.25.0
          pnpm install --frozen-lockfile
          pnpm assets
          . ./scripts/install-trunk.ps1
          . ./scripts/install-media-tools.ps1
          (Join-Path $PWD '.tools/bin') >> $env:GITHUB_PATH
          (Join-Path $PWD '.tools/ffmpeg/ffmpeg-9.0.2-essentials_build/bin') >> $env:GITHUB_PATH
      - name: Formatting and Rust checks
        shell: pwsh
        run: |
          cargo fmt --all -- --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo clippy -p upscale-core -p upscale-studio --all-targets -- -D warnings
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo clippy -p upscale-ui --target wasm32-unknown-unknown -- -D warnings
          exit $LASTEXITCODE
      - name: Real video pipeline tests
        run: cargo test -p upscale-core --locked
      - name: Build desktop application
        run: pnpm tauri build --no-bundle
      - name: Verify responsive UI and local preview
        run: pnpm test:ui
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: upscale-studio-windows-preview
          path: |
            target/release/upscale-studio.exe
            README.md
            LICENSE
          if-no-files-found: error
          retention-days: 14
