name: Android CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests and lint
        run: ./gradlew testDebugUnitTest lintDebug --no-daemon
      - name: Build arm64-v8a and universal APKs
        run: ./gradlew assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: upscale-android-release-input
          path: |
            app/build/outputs/apk/release/app-arm64-v8a-release-unsigned.apk
            app/build/outputs/apk/release/app-universal-release-unsigned.apk
          if-no-files-found: error
          retention-days: 14
