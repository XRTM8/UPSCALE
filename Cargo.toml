[workspace]
resolver = "2"
members = ["crates/upscale-types", "crates/upscale-core", "crates/upscale-ui", "src-tauri"]
default-members = ["crates/upscale-core"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
repository = "https://github.com/XRTM8/UPSCALE"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[profile.wasm-release]
inherits = "release"
opt-level = "s"
