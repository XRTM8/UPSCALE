[package]
name = "upscale-ui"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
upscale-types = { path = "../upscale-types" }
leptos = { version = "0.8.23", features = ["csr"] }
serde.workspace = true
serde_json.workspace = true
serde-wasm-bindgen = "0.6.5"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Window", "Storage", "Document", "HtmlElement", "HtmlInputElement", "HtmlSelectElement", "HtmlVideoElement", "HtmlMediaElement", "Event", "KeyboardEvent"] }
gloo-timers = { version = "0.3", features = ["futures"] }
console_error_panic_hook = "0.1"
